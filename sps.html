<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="sps.cs" />
  </head>
  <body>
    <div class="heading">
      <p id="top">Rock Paper Scissors</p>
    </div>

    <div class="choices">
      <div class="choice" id="rock">
        <img src="rock.png" />
      </div>
      <div class="choice" id="paper">
        <img src="paper.png" />
      </div>
      <div class="choice" id="scissors">
        <img src="scissors.png" />
      </div>
    </div>

    <div class="score-bar">
      <div class="you">
        <p id="user-score">0</p>
        <p>you</p>
      </div>
      <div class="comp">
        <p id="comp-score">0</p>
        <p>Computer</p>
      </div>
    </div>

    <div class="msg">
      <p id="msg-box">Play your move</p>
    </div>
    <script src="sps.js"></script>
  </body>
</html>
